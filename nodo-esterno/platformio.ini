; Nodo esterno: FireBeetle 2 ESP32-C6 + BME280 (I2C su GPIO 19/20).
[env:nodo-esterno]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit BME280 Library
build_flags = -I ../shared