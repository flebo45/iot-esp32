; Nodo dashboard: ESP32-S3 + Waveshare 7,5" e-Paper (800x480 B/N) tramite e-Paper Driver HAT.
; Passo 1: "Hello, Second Brain" a schermo.

[env:dashboard]
; pioarduino = Arduino core 3.x. La piattaforma ufficiale "espressif32" e' ferma al core 2.x
; e non supporta la FireBeetle ESP32-C6: usiamo lo stesso core su entrambi i nodi
; (stessa API ESP-NOW, stesso codice condiviso).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.6.9
build_flags =
    ; Piano B del display: decommenta la riga sotto se con GxEPD2_750_T7 l'immagine
    ; non compare, e' sporca/sfasata o il refresh si blocca (BUSY timeout).
    ; -D EPD_GDEY075T7
    ; Serial sulla porta USB nativa ("USB"). Serve solo se la scheda non ha la porta
    ; "COM/UART" o se colleghi quella nativa; altrimenti lascia commentato.
    ; -D ARDUINO_USB_CDC_ON_BOOT=1
